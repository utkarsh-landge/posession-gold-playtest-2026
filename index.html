<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>POSESSION</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #13161a; }
    #unity-canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 20px;
      padding: 28px; color: #f2f4f6; background: #13161a; font: 600 24px Arial, sans-serif; text-align: center; }
    progress { width: min(320px, 80vw); height: 10px; accent-color: #219c94; }
    #error { max-width: 640px; font-size: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="POSESSION game. Keyboard and mouse required."></canvas>
  <div id="loading"><div>POSESSION</div><progress id="progress" max="1" value="0"></progress><div id="error"></div></div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    function failed(error) {
      console.error(error);
      document.getElementById('error').textContent = 'Game could not load. Refresh this page to try again.';
      progress.hidden = true;
    }
    const loader = document.createElement('script');
    loader.src = 'Build/Gold-WebGL-Share.loader.js';
    loader.onerror = failed;
    loader.onload = () => createUnityInstance(canvas, {
      dataUrl: 'Build/Gold-WebGL-Share.data.unityweb',
      frameworkUrl: 'Build/Gold-WebGL-Share.framework.js.unityweb',
      codeUrl: 'Build/Gold-WebGL-Share.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DefaultCompany',
      productName: 'POSSESSION',
      productVersion: '1.0',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, value => { progress.value = value; }).then(instance => {
      window.unityInstance = instance;
      loading.remove();
      canvas.focus();
    }).catch(failed);
    document.body.appendChild(loader);
  </script>
</body>
</html>
